<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #f2f2f7;
  --surface2: #e5e5ea;
  --line: #d8d8de;
  --text: #000000;
  --text2: #6e6e73;
  --accent: #0071e3;
  --on-accent: #ffffff;
  --glass: rgba(255,255,255,0.78);
  --glass-line: rgba(0,0,0,0.08);
  --shadow: 0 10px 30px rgba(0,0,0,0.12);
  --scrim: rgba(0,0,0,0.35);
  --empty-cell: #dcdce2;
  --glow: rgba(255,138,0,0.18);
  --movie: #ffd23f;
  --show: #6be3ff;
  --game: #ff7ad9;
  --brand: #ff8a00;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Helvetica Neue", Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Helvetica Neue", Arial, sans-serif;
  --serif: "DM Serif Display", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --line: #2c2c2e;
    --text: #ffffff;
    --text2: #a1a1a6;
    --accent: #64a8ff;
    --on-accent: #000000;
    --glass: rgba(40,40,44,0.72);
    --glass-line: rgba(255,255,255,0.08);
    --shadow: 0 10px 40px rgba(0,0,0,0.6);
    --scrim: rgba(0,0,0,0.6);
    --empty-cell: #2c2c2e;
    --glow: rgba(255,122,26,0.32);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000;
  --surface: #1c1c1e;
  --surface2: #2c2c2e;
  --line: #2c2c2e;
  --text: #ffffff;
  --text2: #a1a1a6;
  --accent: #64a8ff;
  --on-accent: #000000;
  --glass: rgba(40,40,44,0.72);
  --glass-line: rgba(255,255,255,0.08);
  --shadow: 0 10px 40px rgba(0,0,0,0.6);
  --scrim: rgba(0,0,0,0.6);
  --empty-cell: #2c2c2e;
    --glow: rgba(255,122,26,0.32);
}
*, *::before, *::after { box-sizing: border-box; }
html { height: var(--app-h, 100%); overflow: hidden; background: radial-gradient(130% 34% at 50% -4%, var(--glow), rgba(0,0,0,0) 72%) no-repeat, var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
img { max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { max-width: 560px; margin: 0 auto; height: 100%; position: relative; display: flex; flex-direction: column; }
#view { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: none; padding: env(safe-area-inset-top, 0px) 0 132px; }

/* Headers */
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px 0; }
.brand { display: flex; align-items: center; gap: 6px; }
.brand-word { font-family: var(--serif); font-size: 24px; line-height: 1; letter-spacing: -0.01em; }
.brand svg { color: var(--brand); }
.head { display: flex; justify-content: space-between; align-items: center; padding: 22px 24px 0; gap: 12px; }
.head h1, .h1 { margin: 0; font-family: var(--display); font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
.topbar + .h1 { padding: 10px 24px 0; }
.head-actions { display: flex; gap: 10px; }
.round { width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--surface); color: var(--text); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.round.brand { background: var(--brand); color: #000; }
.subtitle { margin: 6px 24px 0; color: var(--text2); font-size: 14px; }

/* Chips */
.chips { display: flex; gap: 8px; padding: 16px 24px 0; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { height: 34px; padding: 0 13px; border-radius: 17px; border: none; background: var(--surface); color: var(--text); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; flex-shrink: 0; }
.chip[aria-pressed="true"] { background: var(--brand); color: #000; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; display: inline-block; }

/* Poster art */
.art { position: relative; overflow: hidden; border-radius: 12px; isolation: isolate; }
.art > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
.art-c { position: absolute; width: 46%; aspect-ratio: 1; border-radius: 50%; left: 27%; top: 18%; }
.art-bar { position: absolute; left: -15%; width: 130%; height: 9%; top: 28%; transform: rotate(-12deg); }
.art-sq { position: absolute; width: 42%; aspect-ratio: 1; left: 29%; top: 20%; border: 3px solid; }
.art-title { position: absolute; left: 9px; right: 9px; bottom: 9px; font-weight: 800; font-size: 13px; line-height: 1.1; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,0.6); letter-spacing: -0.01em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.sticker { position: absolute; left: 7px; top: 7px; z-index: 3; height: 20px; padding: 0 7px; border-radius: 10px; background: rgba(0,0,0,0.6); color: #fff; display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 600; }
.sticker i { width: 7px; height: 7px; border-radius: 4px; display: inline-block; }
.badge { position: absolute; right: 7px; top: 7px; z-index: 3; height: 20px; padding: 0 7px; border-radius: 10px; background: rgba(0,0,0,0.6); color: #fff; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; }
.mini-bar { position: absolute; left: 7px; right: 7px; bottom: 7px; z-index: 3; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.28); }
.mini-bar > span { display: block; height: 100%; border-radius: 2px; }

/* Hero */
.hero { margin: 20px 24px 0; border-radius: 22px; position: relative; overflow: hidden; min-height: 248px; box-shadow: var(--shadow); color: #fff; display: block; }
.hero .art { position: absolute; inset: 0; border-radius: 0; }
.hero .art .art-title { display: none; }
.hero-scrim { position: absolute; inset: 0; z-index: 4; background: linear-gradient(180deg, rgba(0,0,0,0) 22%, rgba(0,0,0,0.9) 100%); }
.hero-body { position: relative; z-index: 5; padding: 92px 20px 18px; display: flex; flex-direction: column; gap: 6px; }
.eyebrow { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #d1d1d6; }
.hero-title { font-family: var(--display); font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin: 0; }
.hero-meta { font-size: 13px; color: #d1d1d6; }
.bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.22); margin-top: 4px; }
.bar > span { display: block; height: 100%; border-radius: 2px; }
.hero-actions { display: flex; gap: 10px; margin-top: 8px; }
.pill { height: 44px; padding: 0 18px; border-radius: 22px; border: none; background: var(--brand); color: #000; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.pill.glassy { background: rgba(255,255,255,0.18); color: #fff; width: 44px; padding: 0; justify-content: center; }

/* Rows */
.section-head { display: flex; justify-content: space-between; align-items: baseline; padding: 26px 24px 12px; }
.section-head h2 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.link { border: none; background: none; color: var(--text2); font-size: 14px; font-weight: 500; padding: 8px 0; min-height: 44px; }
.row { display: flex; gap: 14px; padding: 0 24px 6px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.tile { border: none; background: none; padding: 0; text-align: left; width: 112px; flex-shrink: 0; scroll-snap-align: start; display: flex; flex-direction: column; gap: 6px; color: var(--text); }
.tile .art { width: 112px; height: 160px; }
.tile-name { font-size: 13px; font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tile-meta { font-size: 12px; color: var(--text2); }
.wide { border: none; background: none; padding: 0; flex-shrink: 0; scroll-snap-align: start; }
.wide .art { width: 176px; height: 100px; border-radius: 14px; }
.wide .art-title { font-size: 15px; }

/* Empty */
.empty { margin: 24px; padding: 28px 22px; border-radius: 22px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.empty h2 { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.empty p { margin: 0; color: var(--text2); font-size: 15px; }
.btn-primary { height: 50px; padding: 0 22px; border-radius: 25px; border: none; background: var(--brand); color: #000; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.note { margin: 14px 24px 0; padding: 12px 14px; border-radius: 14px; background: var(--surface); color: var(--text2); font-size: 13px; }

/* Library */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 18px 24px 0; }
.stat { border: none; border-radius: 16px; background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 2px; text-align: left; color: var(--text); }
.stat b { font-family: var(--display); font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.stat span { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
.card { margin: 10px 24px 0; padding: 14px; border-radius: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; }
.card-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
.card-head span { font-size: 12px; color: var(--text2); }
.heat-scroll { overflow-x: auto; scrollbar-width: none; }
.heat-scroll::-webkit-scrollbar { display: none; }
.months { position: relative; height: 14px; font-size: 11px; color: var(--text2); min-width: 309px; }
.months span { position: absolute; top: 0; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 9px); grid-auto-columns: 9px; gap: 3px; width: max-content; margin-top: 4px; }
.cell { width: 9px; height: 9px; border-radius: 2px; border: none; padding: 0; background: var(--empty-cell); }
.cell.future { background: transparent; pointer-events: none; }
.cell[aria-pressed="true"] { outline: 2px solid var(--text); outline-offset: 1px; }
.legend { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text2); gap: 8px; flex-wrap: wrap; }
.legend .keys { display: flex; gap: 10px; }
.legend .keys span { display: flex; align-items: center; gap: 4px; }
.day-panel { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.day-panel strong { font-size: 13px; }
.day-panel div { display: flex; align-items: center; gap: 8px; }
.day-panel em { font-style: normal; color: var(--text2); }
.search { margin: 16px 24px 0; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--surface); color: var(--text2); }
.search input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--text); font-size: 16px; }
.chips.tight { padding-top: 10px; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 10px; padding: 18px 24px 0; }
.gtile { border: none; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 6px; color: var(--text); min-width: 0; }
.gtile .art { width: 100%; aspect-ratio: 2 / 3; }
.muted { padding: 30px 24px; color: var(--text2); font-size: 15px; }

/* Vault */
.vault-title { display: flex; align-items: center; gap: 10px; }
.vault-hero { margin: 18px 24px 0; min-height: 190px; border-radius: 22px; position: relative; overflow: hidden; box-shadow: var(--shadow); color: #fff; display: block; width: calc(100% - 48px); border: none; padding: 0; text-align: left; }
.vault-hero .art { position: absolute; inset: 0; border-radius: 0; }
.vault-hero .art .art-title { display: none; }
.vault-hero .shade { position: absolute; inset: 0; z-index: 4; background: linear-gradient(90deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.1) 85%); }
.vault-hero .vbody { position: relative; z-index: 5; padding: 20px; min-height: 190px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; max-width: 78%; }
.gold { color: #e3bd6e; }
.vh-title { font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
.vh-why { font-size: 13px; color: #d1d1d6; line-height: 1.35; }
.rank { position: absolute; left: 7px; top: 7px; z-index: 3; width: 26px; height: 26px; border-radius: 13px; background: rgba(0,0,0,0.65); color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.rank.one { background: #e3bd6e; color: #1a1305; }
.shelf-empty { width: 100%; padding: 22px 16px; border-radius: 14px; border: 1.5px dashed var(--line); color: var(--text2); font-size: 14px; }
.count { font-size: 13px; color: var(--text2); }

/* Tab bar */
#tabbar-wrap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; padding: 0 16px calc(8px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.tabbar { pointer-events: auto; max-width: 420px; margin: 0 auto; height: 66px; border-radius: 33px; background: var(--glass); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); border: 1px solid var(--glass-line); box-shadow: var(--shadow); display: flex; justify-content: space-around; align-items: center; padding: 0 8px; }
.tab { border: none; background: none; min-width: 72px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text2); font-size: 10px; font-weight: 500; }
.tab[aria-current="page"] { color: var(--brand); font-weight: 600; }

/* Sheets */
#overlay:empty { display: none; }
.scrim { position: absolute; inset: 0; z-index: 40; background: var(--scrim); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); border-radius: 28px 28px 0 0; padding: 10px 20px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; animation: up .28s cubic-bezier(.2,.8,.2,1); }
:root:not([data-theme="light"]) .sheet { background: var(--surface); }
:root[data-theme="light"] .sheet { background: #ffffff; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .sheet { background: #ffffff; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.grabber { align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--line); flex-shrink: 0; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
.textbtn { border: none; background: none; color: var(--text2); font-size: 16px; min-height: 44px; padding: 0 2px; }
.textbtn.strong { color: var(--accent); font-weight: 600; }
.field-label { font-size: 13px; font-weight: 600; color: var(--text2); }
.group { display: flex; flex-direction: column; gap: 10px; }
.input { height: 52px; padding: 0 14px; border-radius: 14px; border: none; background: var(--surface2); color: var(--text); font-size: 17px; font-weight: 500; width: 100%; outline: none; }
:root[data-theme="light"] .input, :root[data-theme="light"] textarea.input { background: var(--surface); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .input { background: var(--surface); } }
textarea.input { height: auto; min-height: 84px; padding: 12px 14px; resize: vertical; font-size: 16px; font-weight: 400; line-height: 1.4; }
.types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.type-tile { height: 84px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface2); color: var(--text2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 14px; font-weight: 500; }
.type-tile[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
.seg { display: flex; padding: 4px; border-radius: 14px; background: var(--surface2); gap: 4px; }
.seg button { flex: 1; height: 40px; border: none; border-radius: 11px; background: transparent; color: var(--text2); font-size: 14px; font-weight: 500; }
.seg button[aria-checked="true"] { background: var(--text); color: var(--bg); font-weight: 600; }
.steppers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stepper { display: flex; justify-content: space-between; align-items: center; height: 56px; padding: 0 8px 0 14px; border-radius: 14px; background: var(--surface2); font-size: 15px; }
.stepper div { display: flex; gap: 4px; }
.stepper button { width: 38px; height: 38px; border-radius: 19px; border: none; background: var(--line); color: var(--text); font-size: 20px; font-weight: 600; line-height: 1; }
.poster-row { display: flex; gap: 14px; align-items: stretch; }
.poster-slot { width: 84px; height: 126px; flex-shrink: 0; border-radius: 12px; border: 1.5px dashed var(--text2); background: var(--surface2); color: var(--text2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 12px; font-weight: 600; overflow: hidden; position: relative; }
.poster-slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.poster-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.hint { font-size: 13px; color: var(--text2); line-height: 1.4; }
.limit { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
.suggest { display: flex; flex-direction: column; border-radius: 14px; background: var(--surface2); overflow: hidden; margin-top: 8px; }
.suggest:empty { display: none; }
:root[data-theme="light"] .suggest { background: var(--surface); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .suggest { background: var(--surface); } }
.sug { border: none; background: none; text-align: left; padding: 10px 14px; min-height: 54px; display: flex; gap: 10px; align-items: center; color: var(--text); }
.sug + .sug { border-top: 1px solid var(--line); }
.sug b { display: block; font-size: 15px; font-weight: 600; line-height: 1.25; }
.sug small { display: block; font-size: 12px; color: var(--text2); line-height: 1.3; margin-top: 2px; }
.sug-note { padding: 8px 14px; font-size: 11px; color: var(--text2); }
.offer { display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 16px; background: var(--surface); }
.sheet:not(.detail) .offer { background: var(--surface2); }
.offer img { width: 64px; height: 96px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
.offer-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.offer-body b { font-size: 15px; font-weight: 600; }
.sbtn.brand { background: var(--brand); color: #000; }
.cta { height: 56px; border-radius: 28px; border: none; background: var(--brand); color: #000; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; }
.cta:disabled { opacity: 0.4; }

/* Detail */
.detail { top: 0; max-height: none; border-radius: 0; padding: 0 0 calc(40px + env(safe-area-inset-bottom, 0px)); gap: 0; background: var(--bg) !important; }
.detail-art { position: relative; flex-shrink: 0; overflow: hidden; display: flex; justify-content: center; padding: calc(76px + env(safe-area-inset-top, 0px)) 0 6px; }
.detail-bg { position: absolute; left: -60px; top: -60px; width: calc(100% + 120px); height: calc(100% + 120px); object-fit: cover; filter: blur(40px) saturate(1.25); opacity: 0.6; }

  /* ---------- posters ---------- */

    if (file.type && file.type.indexOf("image/") !== 0) return Promise.reject({ msg: "That file isn’t an image. Pick a JPG, PNG or HEIC." });
    return readAsDataURL(file).then(function (src) {
      return new Promise(function (res, rej) {
        var img = new Image();

  function heatmap() {

      '<button class="textbtn" style="align-self:center" data-action="sort-skip" data-id="' + t.id + '">Skip for now</button></section>';
  }
  (function () {
    var g = null;
    overlay.addEventListener("touchstart", function (e) {
      var card = e.target.closest && e.target.closest("#sorter-card"); if (!card || e.touches.length !== 1) return;
      g = { card: card, x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, on: false };
    }, { passive: true });
    overlay.addEventListener("touchmove", function (e) {
      if (!g) return;
      g.dx = e.touches[0].clientX - g.x; var dy = e.touches[0].clientY - g.y;
      if (!g.on) { if (Math.abs(g.dx) > 8 && Math.abs(g.dx) > Math.abs(dy)) g.on = true; else if (Math.abs(dy) > 10) { g = null; return; } }
      if (!g.on) return;
      e.preventDefault(); e.stopPropagation();
      g.card.style.transition = "none"; g.card.style.transform = "translateX(" + g.dx + "px) rotate(" + (g.dx / 20) + "deg)";
    }, { passive: false });
    overlay.addEventListener("touchend", function () {
      if (!g) return; var c = g.card, dx = g.dx, on = g.on; g = null;
      if (!on) return;
      c.style.transition = "transform .22s ease";
      if (Math.abs(dx) > 90) {
        c.style.transform = "translateX(" + (dx > 0 ? 420 : -420) + "px) rotate(" + (dx > 0 ? 18 : -18) + "deg)";
        var id = c.getAttribute("data-id");
        setTimeout(function () { var t = find(id); if (t) update(t.id, { vibe: dx > 0 ? "headliner" : "unwind" }); renderOverlay(true); }, 200);
      } else c.style.transform = "";
    });
  })();

  function startLocal() {
    state.libSort = lsGet("cueloft.libSort", "added");
    store.mode = "local";
    state.titles = lsGet(LS_T, []); state.activity = lsGet(LS_A, {});
    state.ready = true; render();
  }
  function startCloud(db, uid) {
    store.mode = "cloud";
    var base = db.doc("data/users/" + uid + "/lib");
    store.titlesCol = base.collection("titles");
    store.actDoc = db.doc("data/users/" + uid + "/activity");
    var timer = setTimeout(function () { state.loadNote = "Your library can’t be reached yet. Check your connection; it will appear when it loads."; state.ready = true; render(); }, 10000);
    store.titlesCol.onSnapshot(function (snap) {
      state.titles = snap.docs.map(function (d) { var o = clone(d.data()); o.id = d.id; return o; });
      if (!snap.metadata.fromCache) { clearTimeout(timer); state.loadNote = ""; }
      state.ready = true; render();
    }, function (err) {
      clearTimeout(timer); state.ready = true;
      state.loadNote = err && err.code === "revoked" ? "" : "Your library couldn’t load right now. Reopen Cueloft to try again.";
      render();
    });
    store.actDoc.onSnapshot(function (s) {
      var d = s.exists ? s.data() : null; state.activity = d && d.days ? clone(d.days) : {}; render();
    }, function () {});
  }
  function isStandalone() { return window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches); }

  /* ---------- on-device poster storage (IndexedDB) ---------- */
  var idbP = null, urlCache = {}, pendingP = {};
  function idb() {
    if (!idbP) idbP = new Promise(function (res, rej) {
      var r = indexedDB.open("cueloft", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("posters"); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
    return idbP;
  }
  function idbTx(mode, fn) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction("posters", mode), out = fn(tx.objectStore("posters"));
        tx.oncomplete = function () { res(typeof out === "function" ? out() : out); };
        tx.onerror = function () { rej(tx.error); }; tx.onabort = function () { rej(tx.error); };
      });
    });
  }
  function idbPutBlob(id, blob) {
    return blob.arrayBuffer().then(function (buf) { return idbTx("readwrite", function (st) { st.put({ buf: buf, type: blob.type || "image/jpeg" }, id); }); });
  }
  function idbGet(id) { return idbTx("readonly", function (st) { var q = st.get(id); return function () { return q.result; }; }); }
  function idbDel(id) { return idbTx("readwrite", function (st) { st.delete(id); }); }
  function idbAll() {
    return idbTx("readonly", function (st) {
      var k = st.getAllKeys(), v = st.getAll();
      return function () { return k.result.map(function (key, i) { return { id: key, buf: v.result[i].buf, type: v.result[i].type }; }); };
    });
  }
  function posterSrc(id) {
    if (urlCache[id]) return urlCache[id];
    if (!pendingP[id]) {
      pendingP[id] = 1;
      idbGet(id).then(function (rec) {
        if (rec && rec.buf) { urlCache[id] = URL.createObjectURL(new Blob([rec.buf], { type: rec.type || "image/jpeg" })); render(); }
      }).catch(function () {});
    }
    return null;
  }
  var localAssets = {
    upload: function (blob) {
      var id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      return idbPutBlob(id, blob).then(function () { return { id: id }; }, function () { throw { code: "quota_or_state" }; });
    },
    "delete": function (id) {
      if (urlCache[id]) { URL.revokeObjectURL(urlCache[id]); delete urlCache[id]; }
      delete pendingP[id];
      return idbDel(id);
    },
    list: function () {
      return idbAll().then(function (recs) {
        var bytes = recs.reduce(function (s2, r) { return s2 + (r.buf ? r.buf.byteLength : 0); }, 0);
        return { usage: { files: recs.length, bytes: bytes } };
      });
    }
  };
  var localDownloads = {
    save: function (o) {
      var blob = new Blob([o.data], { type: "application/json" }), file = null;
      try { file = new File([blob], o.filename, { type: "application/json" }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: o.filename }).catch(function (e) { if (e && e.name === "AbortError") throw { code: "declined" }; throw e; });
      }
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = o.filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      return Promise.resolve();
    }
  };

  function fitHeight() {
    var h = window.innerHeight, sc = window.screen;
    if (isStandalone() && sc && window.innerWidth < h && sc.height > h && sc.height - h < 140) h = sc.height;
    document.documentElement.style.setProperty("--app-h", h + "px");
  }
  function boot() {
    fitHeight();
    window.addEventListener("resize", fitHeight);
    window.addEventListener("orientationchange", function () { setTimeout(fitHeight, 250); });
    applyTheme();
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      if (mq.addEventListener) mq.addEventListener("change", function () { applyTheme(); });
    }
    store.downloads = localDownloads;
    if (window.indexedDB) { store.assets = localAssets; state.canPoster = true; }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
    startLocal();
    setTimeout(runEnrichment, 2500);
    window.addEventListener("online", function () { scheduleEnrichment(); });
  }
  boot();
})();
</script>
